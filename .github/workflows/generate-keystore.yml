name: Generate Keystore

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generate keystore
        run: |
          keytool -genkeypair -v \
            -keystore release.keystore \
            -alias release \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass MySecurePass123 \
            -keypass MySecurePass123 \
            -dname "CN=Calculator, OU=Dev, O=Dev, L=City, S=State, C=US"

      - name: Encode to base64
        run: base64 -w 0 release.keystore > release.keystore.base64

      - name: Upload keystore artifact
        uses: actions/upload-artifact@v4
        with:
          name: keystore-files
          path: |
            release.keystore
            release.keystore.base64
